server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reale, gehashte Vite-Build-Assets liegen ausschliesslich unter /assets/ (siehe
    # frontend/vite.config.ts-Build-Output). Diese Location wird bewusst getrennt vom
    # allgemeinen SPA-Fallback gehalten: ohne sie wuerde ein nicht existierender,
    # asset-artiger Pfad (z.B. /assets/definitiv-nicht-vorhanden.js) faelschlich auf
    # index.html zurueckfallen (200) statt 404 zu liefern - Spec 0016, Akzeptanzkriterium
    # zum "Lackmustest", dass die try_files-Regel nicht zu breit gefasst ist.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
