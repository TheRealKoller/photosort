# add_header wird nur in location-Bloecke OHNE eigene add_header-Direktive vererbt. Jeder Block mit
# add_header (hier: /assets/ und /) muss deshalb jeden kuenftig auf server-Ebene gesetzten
# Security-Header wiederholen - sonst fehlt er still genau dort, auch bei index.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker-interner DNS-Server. valid=10s: nginx loest den Backend-Namen spaetestens nach zehn
    # Sekunden neu auf - ein neu erstellter backend-Container mit neuer IP ist damit ohne Neustart
    # des Frontends wieder erreichbar.
    resolver 127.0.0.11 valid=10s;

    # Reale, gehashte Vite-Build-Assets liegen ausschliesslich unter /assets/ (siehe
    # frontend/vite.config.ts-Build-Output). Diese Location wird bewusst getrennt vom
    # allgemeinen SPA-Fallback gehalten: ohne sie wuerde ein nicht existierender,
    # asset-artiger Pfad (z.B. /assets/definitiv-nicht-vorhanden.js) faelschlich auf
    # index.html zurueckfallen (200) statt 404 zu liefern - Spec 0016, Akzeptanzkriterium
    # zum "Lackmustest", dass die try_files-Regel nicht zu breit gefasst ist.
    # Gehashte Dateinamen aendern sich mit jedem Inhalt: ein Jahr unveraenderlich cachen.
    # immutable steht ausschliesslich hier - an index.html haelt es eine fehlerhafte Fassung ein
    # Jahr im Browser fest.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Einziger Weg zur API: /api/<pfad> geht als /<pfad> an den backend-Service. Nur unter /api/,
    # damit Client-Routen wie /projects/3 beim SPA-Fallback bleiben, obwohl das Backend selbst
    # ebenfalls unter /projects antwortet.
    #
    # Das Ziel steht in einer Variablen, sonst loeste nginx "backend" nur einmal beim Start auf und
    # proxyte nach einer Backend-Neuerstellung gegen die alte IP (und startete ohne laufendes
    # Backend gar nicht). Den Praefix schneidet deshalb das rewrite ab, nicht ein URI-Teil in
    # proxy_pass: steht dort neben einer Variablen ein URI, ersetzt er die gesamte Anfrage-URI -
    # jede Anfrage ginge an "/".
    # Kein eigener Cache-Control: massgeblich bleibt das Backend.
    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # index.html, SPA-Fallback, sw.js, registerSW.js, manifest.webmanifest, workbox-*.js: bei jedem
    # Laden beim Server nachfragen, damit ein Release sofort ankommt. no-cache genuegt - die Dateien
    # sind statisch, fuer alle Nutzer gleich und enthalten weder Token noch Nutzerdaten.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
