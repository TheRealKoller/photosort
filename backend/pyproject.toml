[project]
name = "photosort"
version = "0.1.0"
description = "PhotoSort backend: API, OpenCloud integration, photo scoring worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "httpx>=0.27",
    "pillow>=11.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    # Lokale Gesichtserkennung fuer die Kategorie-Klassifikation
    # (specs/features/0024-top-photo-selection-category-mix.md, decisions/0015-lokale-kategorie-
    # klassifikation.md) - verifiziert vor der Umsetzung: die py3-none-manylinux_2_28-Wheels decken
    # sowohl x86_64 als auch aarch64 ab, kompatibel mit dem python:3.12-slim-Dockerfile.
    "mediapipe>=0.10",
    "numpy>=1.26",
    # Lokale Aesthetik-Bewertung (NIMA) fuer criterion_key="aesthetics"
    # (specs/features/0038-vier-zusaetzliche-kriterien-tier-gebaeude-schnitt-aesthetik.md,
    # decisions/0022-lokale-modellwahl-tier-gebaeude-aesthetik-kriterien.md Punkt 3) - regulaerer
    # Paketname "tensorflow" statt des urspruenglich erwogenen "tensorflow-cpu": Verifikation vor
    # der Umsetzung (PyPI Simple-API) ergab, dass tensorflow-cpu fuer KEINE Version eine
    # aarch64-Linux-Wheel liefert, waehrend "tensorflow" seit Version 2.16 fuer x86_64 UND aarch64
    # (cp312, manylinux) verfuegbar UND dort ohne das optionale [and-cuda]-Extra CPU-only ist (kein
    # GPU-Runtime-Bundle) - siehe ADR-0022-Nachtrag vom 2026-08-15. Installierbarkeit auf dem
    # Ziel-Image (python:3.12-slim) UND CPU-only-Verhalten real per Docker-Smoke-Test verifiziert
    # (kein zusaetzliches apt-Paket noetig, anders als bei mediapipe/opencv).
    "tensorflow>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Gepinnte Modelldateien (.tflite fuer mediapipe, .hdf5 fuer die NIMA-Gewichte, Spec 0038) - ohne
# diese Deklaration wuerde `pip install .` (siehe backend/Dockerfile) die committeten Binaerassets
# NICHT ins installierte Package uebernehmen (anders als bei "pip install -e ." im lokalen
# Dev-Setup, das direkt auf den Quellbaum zeigt).
[tool.setuptools.package-data]
photosort = ["assets/*.tflite", "assets/*.hdf5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# mediapipe liefert keine Typstubs/py.typed-Marker (classification.py,
# specs/features/0024-top-photo-selection-category-mix.md) - dieselbe Behandlung wie eine
# untypisierte Drittanbieter-Bibliothek, kein Grund, --strict projektweit aufzuweichen.
[[tool.mypy.overrides]]
module = ["mediapipe.*"]
ignore_missing_imports = true

# tensorflow liefert eigene Typstubs, aber nicht jede lokale Dev-Umgebung dieses Repos kann
# tensorflow tatsaechlich installieren (Copilot-Review-Fund, PR #88: praezisiert, welche Groesse
# hier eigentlich das Problem ist - NICHT die oben konfigurierte `python_version = "3.12"`
# [das ist die von mypy fuer die STATISCHE Typpruefung angenommene Zielversion, unabhaengig vom
# tatsaechlichen Interpreter], sondern die konkrete lokale Interpreter-/Plattform-Kombination:
# z.B. eine neuere CPython-Version, fuer die zum jeweiligen Zeitpunkt noch kein passendes
# tensorflow-Wheel auf PyPI existiert - das Ziel-Image `python:3.12-slim`/x86_64/aarch64 selbst
# ist unproblematisch, siehe pyproject.toml-Dependency-Kommentar oben) - ignore_missing_imports
# haelt mypy --strict trotzdem lauffaehig, entkoppelt von der lokalen tensorflow-
# Installierbarkeit, ohne die Typpruefung fuer den Rest des Projekts aufzuweichen (gleiches
# Muster wie beim mediapipe-Override oben).
[[tool.mypy.overrides]]
module = ["tensorflow.*"]
ignore_missing_imports = true
