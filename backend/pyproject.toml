[project]
name = "photosort"
version = "0.1.0"
description = "PhotoSort backend: API, OpenCloud integration, photo scoring worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "httpx>=0.27",
    "pillow>=11.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    # Lokale Gesichtserkennung fuer die Kategorie-Klassifikation
    # (specs/features/0024-top-photo-selection-category-mix.md, decisions/0015-lokale-kategorie-
    # klassifikation.md) - verifiziert vor der Umsetzung: die py3-none-manylinux_2_28-Wheels decken
    # sowohl x86_64 als auch aarch64 ab, kompatibel mit dem python:3.12-slim-Dockerfile.
    "mediapipe>=0.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# mediapipe liefert keine Typstubs/py.typed-Marker (classification.py,
# specs/features/0024-top-photo-selection-category-mix.md) - dieselbe Behandlung wie eine
# untypisierte Drittanbieter-Bibliothek, kein Grund, --strict projektweit aufzuweichen.
[[tool.mypy.overrides]]
module = ["mediapipe.*"]
ignore_missing_imports = true
