[project]
name = "photosort-demo-scripts"
version = "0.1.0"
description = "Eigenstaendiges Dev-/Demo-Tooling fuer PhotoSort, ausserhalb des Backend-Packages (siehe specs/features/0009-local-opencloud-demo-stack.md, architecture/0002-testkonzept.md)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff==0.16.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Review-Finding (Copilot): ohne explizites [build-system] fiel "pip install -e .[dev]" auf
# setuptools' impliziten Auto-Discovery-Fallback zurueck - funktionierte zufaellig (kein
# importierbares Package hier, nur lose Skripte/Tests/Bilddateien), war aber
# versions-/tool-abhaengig und daher nicht garantiert stabil. "scripts/" ist bewusst kein
# importierbares Package (seed-opencloud-demo.py wird per Pfad geladen, siehe
# tests/conftest.py) - py-modules explizit leer, damit setuptools nichts zu discovern versucht.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["demo_photos"]

# Markdown bleibt ausgenommen (Akzeptanzkriterium K2, ADR 0078 Abschnitt 4): ruff formatiert seit
# 0.16.0 standardmaessig Python-Codebloecke INNERHALB von .md-Dateien. Heute liegt unter scripts/
# keine .md-Datei - der Ausschluss ist aktiv konfiguriert, damit der Fall nicht eintritt, sobald
# jemand dort eine anlegt.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Dieselbe getrennte E501-Grenze wie in backend/pyproject.toml (ADR 0078 Abschnitt 3): der
# Formatierer darf die Zielbreite ueberschreiten, wo er nicht umbrechen kann. line-length = 100
# bleibt die Zielbreite; E501 bleibt aktiv und schlaegt erst ab 111 Zeichen an.
[tool.ruff.lint.pycodestyle]
max-line-length = 110
