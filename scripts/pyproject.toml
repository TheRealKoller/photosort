[project]
name = "photosort-demo-scripts"
version = "0.1.0"
description = "Eigenstaendiges Dev-/Demo-Tooling fuer PhotoSort, ausserhalb des Backend-Packages (siehe specs/features/0009-local-opencloud-demo-stack.md, architecture/0002-testkonzept.md)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Review-Finding (Copilot): ohne explizites [build-system] fiel "pip install -e .[dev]" auf
# setuptools' impliziten Auto-Discovery-Fallback zurueck - funktionierte zufaellig (kein
# importierbares Package hier, nur lose Skripte/Tests/Bilddateien), war aber
# versions-/tool-abhaengig und daher nicht garantiert stabil. "scripts/" ist bewusst kein
# importierbares Package (seed-opencloud-demo.py wird per Pfad geladen, siehe
# tests/conftest.py) - py-modules explizit leer, damit setuptools nichts zu discovern versucht.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["demo_photos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
