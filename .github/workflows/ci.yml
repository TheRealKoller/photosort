name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies for mediapipe/opencv
        # Analog zu backend/Dockerfile: ubuntu-latest bringt diese von OpenCV/mediapipe
        # dynamisch gelinkten Bibliotheken nicht mit - ein reines "pip install mediapipe"
        # schlaegt sonst zur Laufzeit (z.B. FaceDetector-Instanziierung in
        # test_classification.py) mit "OSError: libEGL.so.1/libGL.so.1/... cannot open
        # shared object file" fehl.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libxcb1 libegl1 libgles2
      # specs/decisions/0033-modell-asset-download-statt-commit-label-embedder.md: das
      # label_embedder.onnx-Asset (~113 MiB) ueberschreitet GitHubs 100-MiB-Push-Limit und ist
      # deshalb nicht mehr Teil des Repositorys - test_label_embedding.py::TestLabelEmbedderAssets/
      # TestRealAssetOutputDimension laufen direkt gegen die Datei auf der Festplatte, muss also
      # vor dem Testlauf vorliegen. actions/cache (Schluessel = der bereits im Code hinterlegte
      # SHA256-Hash) haelt die tatsaechliche HuggingFace-Abrufhaeufigkeit gering - das Skript
      # selbst ist ohnehin idempotent (ueberspringt den Download bei bereits passendem Hash), der
      # Cache spart zusaetzlich den wiederholten Download bei einem Cache-Hit.
      - name: Read pinned label-embedder model hash
        id: label-embedder-hash
        run: echo "sha256=$(sed -n 's/^LABEL_EMBEDDER_ONNX_SHA256 = "\([0-9a-f]\{64\}\)"$/\1/p' src/photosort/label_embedding.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: backend/src/photosort/assets/label_embedder.onnx
          key: label-embedder-onnx-${{ steps.label-embedder-hash.outputs.sha256 }}
      - name: Download pinned model assets
        run: ../scripts/fetch-label-embedder-model.sh
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Test (pytest, coverage gate 80%)
        run: pytest --cov=photosort --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  # Deckt alles unter scripts/ ab - neben den Demo-Skripten auch die Repo-Konsistenztests, die
  # seit ADR 0057 an die Stelle des geloeschten Board-Werkzeugs getreten sind (Board-Zugriff sind
  # jetzt einzelne gh-Befehle in den Skill-Dateien, geprueft wird deren Text). Kein numerisches
  # Coverage-Gate (anders als backend), der Abdeckungsanspruch steht in der Teststrategie der
  # jeweiligen Spec. Kein echtes gh/Netzwerk hier.
  demo-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Validate docker-compose.yml + docker-compose.demo.yml overlay
        run: |
          cp .env.demo.example .env
          docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile seed config -q
      - name: Build seed image (Dockerfile smoke test, no real OpenCloud container)
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile seed build seed
      - name: Functional check - explicit IPv4-only default network (spec 0010)
        run: |
          set -euo pipefail
          # Isoliert vom vorherigen Overlay-Schritt: das dort kopierte Demo-.env soll
          # diesen Check nicht implizit beeinflussen (Compose liest .env automatisch
          # aus dem CWD, unabhängig von -f).
          rm -f .env
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose up -d postgres redis
          network_count=$(docker compose config --format json | jq '.networks | length')
          test "$network_count" = "1"
          network=$(docker compose config --format json | jq -r '.networks | to_entries[0].value.name')
          echo "Inspecting network: $network"
          enable_ipv6=$(docker network inspect "$network" --format '{{.EnableIPv6}}')
          driver=$(docker network inspect "$network" --format '{{.Driver}}')
          echo "EnableIPv6=$enable_ipv6 Driver=$driver"
          test "$enable_ipv6" = "false"
          test "$driver" = "bridge"
          docker compose down
          if docker network ls --format '{{.Name}}' | grep -qx "$network"; then
            echo "Network $network still exists after 'docker compose down'" >&2
            exit 1
          fi
      - name: Static check - worker command runs no migration (spec 0013)
        run: |
          set -euo pipefail
          worker_command=$(docker compose config --format json | jq -r '.services.worker.command | join(" ")')
          echo "worker command: $worker_command"
          if echo "$worker_command" | grep -qi "alembic"; then
            echo "worker command still runs alembic - migrations must run only in backend" >&2
            exit 1
          fi
          backend_command=$(docker compose config --format json | jq -r '.services.backend.command | join(" ")')
          echo "backend command: $backend_command"
          echo "$backend_command" | grep -q "alembic upgrade head"
          echo "$backend_command" | grep -q "uvicorn"
      - name: Static check - LANDMARK_PROVIDER/LANDMARK_MODEL/MISTRAL_API_KEY passthrough (spec 0057, 0304)
        run: |
          set -euo pipefail
          # Keine real gesetzten Secrets hier - nur ein harmloser Testwert fuer
          # MISTRAL_API_KEY, siehe Sicherheitshinweis in der Spec (kein Secret-Leck
          # ueber die interpolierte Ausgabe von "docker compose config").
          unset LANDMARK_PROVIDER LANDMARK_MODEL MISTRAL_API_KEY || true

          # specs/features/0304-cloud-modell-je-anbieter-waehlbar.md: LANDMARK_MODEL muss an
          # BEIDE Dienste durchgereicht werden. Nur der worker ruft an, nur das backend
          # schaetzt - sieht einer der beiden die Variable nicht, zeigt die Oberflaeche einen
          # anderen Preis als den, der bezahlt wird, ohne dass irgendetwas fehlschlaegt.
          echo "--- default (no LANDMARK_PROVIDER/LANDMARK_MODEL/MISTRAL_API_KEY set) ---"
          for service in backend worker; do
            provider=$(docker compose config --format json | jq -r ".services.$service.environment.LANDMARK_PROVIDER")
            model=$(docker compose config --format json | jq -r ".services.$service.environment.LANDMARK_MODEL")
            key=$(docker compose config --format json | jq -r ".services.$service.environment.MISTRAL_API_KEY")
            echo "$service: LANDMARK_PROVIDER=$provider LANDMARK_MODEL=$model MISTRAL_API_KEY=$key"
            test "$provider" = "anthropic"
            test "$model" = ""
            test "$key" = ""
          done

          echo "--- override (LANDMARK_PROVIDER=mistral, LANDMARK_MODEL/MISTRAL_API_KEY set) ---"
          export LANDMARK_PROVIDER=mistral
          export LANDMARK_MODEL=ministral-3b-2512
          export MISTRAL_API_KEY=ci-static-check-value
          for service in backend worker; do
            provider=$(docker compose config --format json | jq -r ".services.$service.environment.LANDMARK_PROVIDER")
            model=$(docker compose config --format json | jq -r ".services.$service.environment.LANDMARK_MODEL")
            key=$(docker compose config --format json | jq -r ".services.$service.environment.MISTRAL_API_KEY")
            echo "$service: LANDMARK_PROVIDER=$provider LANDMARK_MODEL=$model MISTRAL_API_KEY=$key"
            test "$provider" = "mistral"
            test "$model" = "ministral-3b-2512"
            test "$key" = "ci-static-check-value"
          done
          unset LANDMARK_PROVIDER LANDMARK_MODEL MISTRAL_API_KEY
      - name: Functional check - single-service migration ownership against a fresh DB (spec 0013)
        run: |
          set -euo pipefail
          # Isoliert vom vorherigen Schritt, siehe Kommentar oben zum IPv4-Check.
          rm -f .env
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT

          export AUTH_SEED_USER1_USERNAME=ci-user1
          export AUTH_SEED_USER1_PASSWORD="ci-password-1-$RANDOM"
          export AUTH_SEED_USER2_USERNAME=ci-user2
          export AUTH_SEED_USER2_PASSWORD="ci-password-2-$RANDOM"
          export SECRET_KEY="ci-only-secret-key-not-for-production-0013-$RANDOM"

          docker compose up -d --build backend worker

          # "docker compose up" blockiert wegen worker's "depends_on: backend: condition:
          # service_healthy" bereits selbst, bis backend healthy ist - diese Wartschleife ist
          # eine bewusste zweite Verteidigungslinie (u.a. gegen Compose-Versionsunterschiede
          # zwischen lokal und CI-Runner) und liefert im Fehlerfall eine klare Fehlermeldung
          # statt eines reinen "dependency failed to start"-Abbruchs von "up" selbst.
          echo "Waiting for backend to become healthy..."
          backend_cid=$(docker compose ps -q backend)
          healthy=0
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$backend_cid")
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "backend did not become healthy in time" >&2
            docker compose logs
            exit 1
          fi

          backend_log=$(docker compose logs backend)
          worker_log=$(docker compose logs worker)

          echo "--- backend ran the migration exactly once (revision 1574f8180817) ---"
          # alembic loggt jede Revision zweimal in der Kette (einmal als Ziel des eigenen
          # Upgrade-Schritts, einmal als Quelle des nächsten) - "-> 1574f8180817," matcht
          # gezielt nur den eigenen Upgrade-Schritt, nicht den Folgeschritt.
          revision_hits=$(echo "$backend_log" | grep -c -- "-> 1574f8180817," || true)
          test "$revision_hits" = "1"

          echo "--- worker never invoked alembic ---"
          if echo "$worker_log" | grep -qi "alembic"; then
            echo "worker log unexpectedly mentions alembic" >&2
            exit 1
          fi

          echo "--- known race error does not appear in either log ---"
          if printf '%s\n%s\n' "$backend_log" "$worker_log" | grep -q 'duplicate key value violates unique constraint "pg_type_typname_nsp_index"'; then
            echo "race condition error present in logs" >&2
            exit 1
          fi

          echo "--- alembic_version has exactly one row matching the current head ---"
          expected_head=$(docker compose exec -T backend alembic heads | awk '{print $1}')
          actual_rows=$(docker compose exec -T postgres psql -U "${POSTGRES_USER:-photosort}" -d "${POSTGRES_DB:-photosort}" -tAc "SELECT version_num FROM alembic_version;")
          row_count=$(printf '%s' "$actual_rows" | grep -c . || true)
          test "$row_count" = "1"
          test "$(printf '%s' "$actual_rows" | tr -d '[:space:]')" = "$expected_head"

          echo "--- RestartCount is 0 for both containers ---"
          backend_restarts=$(docker inspect --format '{{.RestartCount}}' "$backend_cid")
          worker_restarts=$(docker inspect --format '{{.RestartCount}}' "$(docker compose ps -q worker)")
          test "$backend_restarts" = "0"
          test "$worker_restarts" = "0"

          echo "--- login with the seeded user succeeds ---"
          login_response_file=$(mktemp)
          login_status=$(curl -s -o "$login_response_file" -w '%{http_code}' -X POST "http://localhost:${BACKEND_PORT:-8000}/auth/login" -H 'Content-Type: application/json' -d "{\"username\": \"$AUTH_SEED_USER1_USERNAME\", \"password\": \"$AUTH_SEED_USER1_PASSWORD\"}")
          test "$login_status" = "200"
          grep -q "access_token" "$login_response_file"
          rm -f "$login_response_file"
          # Kein explizites "docker compose down" hier nötig - der "trap ... EXIT" oben
          # räumt den Stack inkl. Volume bereits auf.
      - name: Functional check - SPA fallback in frontend nginx (spec 0016)
        run: |
          set -euo pipefail
          # Isoliert vom vorherigen Schritt, siehe Kommentar oben zum IPv4-Check.
          rm -f .env
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT

          # Bewusst "--no-deps": der SPA-Fallback ist rein nginx-seitig und haengt nicht
          # von backend/postgres/redis ab (siehe Teststrategie, Spec 0016).
          docker compose up -d --no-deps --build frontend

          echo "Waiting for frontend to respond..."
          base_url="http://localhost:${FRONTEND_PORT:-8080}"
          ready=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "$base_url/"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "frontend did not respond in time" >&2
            docker compose logs frontend
            exit 1
          fi

          # Holt Status+Body in einem einzigen curl-Aufruf statt getrennter Requests fuer
          # Status und Body (weniger redundante Requests, ein Trennzeichen am Ende reicht).
          # Ergebnis in FETCH_STATUS/FETCH_BODY, plus Echo des Status vor jeder Assertion
          # fuer bessere Diagnose bei einem CI-Fehlschlag (analog zum IPv4-Check oben).
          fetch() {
            local url="$1" response
            response=$(curl -s -w '\n%{http_code}' "$url")
            FETCH_STATUS="${response##*$'\n'}"
            FETCH_BODY="${response%$'\n'*}"
          }

          echo "--- GET / returns 200 with index.html content ---"
          fetch "$base_url/"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "200"
          index_body="$FETCH_BODY"

          echo "--- GET /projects/3 (erfundene Client-Route) faellt auf index.html-Body zurueck, 200 ---"
          fetch "$base_url/projects/3"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "200"
          test "$FETCH_BODY" = "$index_body"

          echo "--- GET /this/path/does/not/exist (generischer Pfad) faellt auf index.html-Body zurueck, 200 ---"
          fetch "$base_url/this/path/does/not/exist"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "200"
          test "$FETCH_BODY" = "$index_body"

          echo "--- echtes statisches Asset wird direkt ausgeliefert (200, korrekter Content-Type, kein index.html-Body) ---"
          asset_path=$(docker compose exec -T frontend sh -c "find /usr/share/nginx/html/assets -maxdepth 1 -type f -name '*.js' | head -n1" | tr -d '\r\n')
          if [ -z "$asset_path" ]; then
            echo "kein gebautes JS-Asset im Image gefunden" >&2
            exit 1
          fi
          asset_url_path="/assets/$(basename "$asset_path")"
          fetch "$base_url$asset_url_path"
          asset_content_type=$(curl -s -o /dev/null -w '%{content_type}' "$base_url$asset_url_path")
          echo "status: $FETCH_STATUS, content-type: $asset_content_type"
          test "$FETCH_STATUS" = "200"
          echo "$asset_content_type" | grep -qi "javascript"
          test "$FETCH_BODY" != "$index_body"

          echo "--- nicht existentes, asset-artiges Pfad bleibt 404 (try_files nicht zu breit gefasst) ---"
          fetch "$base_url/assets/definitiv-nicht-vorhanden.js"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "404"

  # Browsergestuetzte Oberflaechenpruefung gegen den REAL laufenden Pruefstack
  # (specs/features/0174-browser-zugang-fuer-claude.md, ADR
  # specs/decisions/0058-browsergestuetzte-oberflaechenpruefung.md).
  #
  # BLOCKIEREND und bewusst ohne Pfadfilter: ein Backend-Change kann die Oberflaeche genauso
  # brechen wie ein Frontend-Change. Kein "continue-on-error", keine Wiederholungen (retries: 0
  # steht in e2e/playwright.config.ts und ist dort per Assertion gebunden, siehe
  # e2e/tests/toolchain.spec.ts) - ein roter Lauf ist ein Befund, kein Rauschen.
  #
  # Der Job referenziert KEIN secrets.* und erweitert die Workflow-permissions nicht. Der Stack
  # enthaelt weder OpenCloud noch den Worker; alle Zustaende kommen aus dem deterministischen
  # Seeder.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Die vier Nachweis-Schritte laufen VOR dem teuren Image-Bau: eine verletzte
      # --- Sicherheitszusage soll in Sekunden auffallen, nicht erst nach dem Stackstart.

      - name: Nachweis - keine Bilddatei unter e2e/ im Git-Index
        run: |
          set -euo pipefail
          pattern='\.(png|jpe?g|gif|webp|bmp|tiff?|avif|heic|ico)$'
          tracked=$(git ls-files -- e2e | grep -Ei "$pattern" || true)
          if [ -n "$tracked" ]; then
            echo "Bilddateien unter e2e/ im Git-Index gefunden:" >&2
            echo "$tracked" >&2
            echo "Die wichtigste Projektregel lautet: nie Bilddaten im Repository." >&2
            exit 1
          fi
          # Gegenprobe: der Ausdruck erkennt eine Bilddatei tatsaechlich. Ohne sie bestuende
          # dieser Schritt auch mit einem kaputten Muster - er faende dann eben nie etwas.
          echo 'e2e/artifacts/beispiel.png' | grep -Eiq "$pattern"
          echo "OK: keine Bilddatei unter e2e/ versioniert (Muster durch Gegenprobe belegt)."

      - name: Nachweis - eigener Compose-Projektname
        run: |
          set -euo pipefail
          name=$(docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --format json | jq -r '.name')
          echo "Compose-Projektname: $name"
          # Ohne eigenen Namen benutzte der Pruefstack die Volumes eines lokal laufenden
          # Produktiv-/Demo-Stacks mit - der Seeder liefe dann gegen dessen Datenbank und Cache.
          test "$name" = "photosort-e2e"

      - name: Nachweis - jede veroeffentlichte Portbindung liegt auf 127.0.0.1
        run: |
          set -euo pipefail
          # Erwartete Zahl veroeffentlichter Bindungen: backend und frontend. postgres/redis
          # veroeffentlichen nichts. Die ANZAHL ist Teil der Zusicherung: ohne sie bestuende der
          # Schritt auch dann, wenn er - Tippfehler, geaenderte Ausgabestruktur, falsches -f -
          # gar keine Bindung faende. Und weil Compose ports-Listen beim Ueberlagern ERGAENZT
          # statt ersetzt, faende eine naive Ueberlagerung hier drei Bindungen statt zwei, davon
          # eine weiterhin offene.
          expected_bindings=2

          check_bindings() {
            local config_json="$1" rows count offending
            rows=$(printf '%s' "$config_json" | jq -r '.services | to_entries[] | .key as $svc | (.value.ports // [])[] | "\($svc) \(.host_ip) \(.published)"')
            count=$(printf '%s\n' "$rows" | grep -c . || true)
            echo "gefundene Bindungen ($count):"
            printf '%s\n' "$rows"
            if [ "$count" != "$expected_bindings" ]; then
              echo "Erwartet waren $expected_bindings veroeffentlichte Bindungen." >&2
              return 1
            fi
            offending=$(printf '%s\n' "$rows" | awk '$2 != "127.0.0.1"' || true)
            if [ -n "$offending" ]; then
              echo "Nicht auf 127.0.0.1 gebundene Veroeffentlichung(en):" >&2
              printf '%s\n' "$offending" >&2
              return 1
            fi
            return 0
          }

          config=$(docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --format json)
          check_bindings "$config"

          # Zwei Gegenproben im selben Schritt, je eine pro Fehlerklasse - ohne sie waere "alles
          # gruen" nicht von "die Pruefung findet gar nichts mehr" zu unterscheiden.
          #
          # (a) eine ungebundene Veroeffentlichung: faellt ueber die host_ip-Bedingung.
          printf 'services:\n  frontend:\n    ports: !override\n      - "8099:80"\n' > /tmp/e2e-probe-unbound.yml
          # (b) eine NAIV ueberlagerte ports-Liste ohne "!override": Compose ERGAENZT sie, es
          #     entstehen drei Bindungen - alle drei auf 127.0.0.1. Diesen Fall findet
          #     ausschliesslich die Anzahl-Assertion, und er ist genau der reale Fallstrick.
          printf 'services:\n  frontend:\n    ports:\n      - "127.0.0.1:8099:80"\n' > /tmp/e2e-probe-appended.yml

          for probe in /tmp/e2e-probe-unbound.yml /tmp/e2e-probe-appended.yml; do
            broken=$(docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f "$probe" config --format json)
            if check_bindings "$broken" > /dev/null 2>&1; then
              echo "Gegenprobe fehlgeschlagen: $probe wurde NICHT als Fehler gemeldet." >&2
              exit 1
            fi
          done
          echo "OK: alle Bindungen lokal, und beide Fehlerklassen werden nachweislich gemeldet."

      - name: Nachweis - Koeder-.env wird vom Overlay vollstaendig geschlagen
        run: |
          set -euo pipefail
          # Compose liest .env immer automatisch aus dem Arbeitsverzeichnis, unabhaengig von -f.
          # Bliebe im Overlay auch nur EINE Variable des Produktivstacks interpolierbar, zoege der
          # Pruefstack deren Wert - im Ernstfall den echten OpenCloud-App-Token.
          sentinel=photosort-sentinel-must-not-appear
          trap 'rm -f .env' EXIT
          : > .env

          # DIE NAMEN WERDEN ABGELEITET, NICHT GEPFLEGT. Eine hier aufgezaehlte Liste deckte immer
          # nur den Stand ihres Schreibtags ab: erweitert eine kuenftige Spec docker-compose.yml um
          # eine Variable, ohne sie im e2e-Overlay zu setzen, bliebe dieser Schritt gruen - waehrend
          # der Pruefstack den Wert genau dieser Variable aus einer echten .env zoege. Genau der
          # Pfad, den dieser Nachweis versperren soll.
          keys=$(grep -oE '\$\{[A-Z_][A-Z0-9_]*' docker-compose.yml | sed 's/^\${//' | sort -u)
          key_count=$(printf '%s\n' "$keys" | grep -c . || true)
          echo "interpolierbare Variablen der Basisdatei ($key_count):"
          printf '%s\n' "$keys" | tr '\n' ' '
          echo

          # Eine leere Liste bestuende trivial - der Schritt legte dann eine leere .env an und
          # faende erwartungsgemaess keinen Sentinel. Zwei Zusicherungen dagegen: es wurde
          # ueberhaupt etwas gefunden, und die gefaehrlichste Variable ist darunter. Der zweite
          # Name ist bewusst KEINE gepflegte Liste, sondern ein einzelner Kanarienvogel: bricht die
          # Ableitung (geaendertes Dateiformat, falscher Pfad, kaputter Ausdruck), faellt das hier
          # auf statt still.
          test "$key_count" -gt 0
          printf '%s\n' "$keys" | grep -qx OPENCLOUD_APP_TOKEN

          # Port-Variablen brauchen einen numerischen Koeder - ein Wort waere schon beim Parsen der
          # Basisdatei ungueltig und der Schritt scheiterte aus dem falschen Grund. Fuer sie prueft
          # weiter unten stattdessen die gerenderte Portliste, dass das Overlay geschlagen hat.
          port_decoy=59000
          for key in $keys; do
            case "$key" in
              *_PORT)
                port_decoy=$((port_decoy + 1))
                echo "$key=$port_decoy" >> .env
                ;;
              *)
                echo "$key=$sentinel" >> .env
                ;;
            esac
          done

          # Das Worker-Profil wird mitgerendert: der Dienst laeuft im Pruefstack nicht, seine
          # Umgebung ist aber Teil derselben Zusage und ohne aktiviertes Profil gar nicht in der
          # Ausgabe enthalten.
          rendered=$(docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile nicht-im-pruefstack config)
          if printf '%s' "$rendered" | grep -q "$sentinel"; then
            echo "Werte aus der Koeder-.env sind in die Pruefstack-Konfiguration durchgeschlagen:" >&2
            printf '%s' "$rendered" | grep -n "$sentinel" >&2
            exit 1
          fi
          ports=$(docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --format json | jq -r '[.services | to_entries[] | (.value.ports // [])[] | .published] | sort | join(",")')
          echo "veroeffentlichte Ports: $ports"
          test "$ports" = "8000,8080"

          # Gegenprobe: der Sentinel-Vergleich schlaegt bei einer tatsaechlich interpolierbaren
          # Variablen an. Geprueft am Basisstack OHNE Overlay - dort ist genau das der Fall.
          if ! docker compose -f docker-compose.yml config | grep -q "$sentinel"; then
            echo "Gegenprobe fehlgeschlagen: der Sentinel-Vergleich schlaegt nicht einmal ohne Overlay an." >&2
            exit 1
          fi
          echo "OK: keine Variable des Produktivstacks bleibt im Pruefstack interpolierbar."

      # --- Ab hier der eigentliche Lauf -------------------------------------------------------

      - uses: actions/setup-node@v4
        with:
          # Die Werkzeuge unter e2e/bin laufen ohne Build-Schritt direkt in Node
          # (Type-Stripping ab 22.18) - siehe "engines" in e2e/package.json.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json
      - name: Abhaengigkeiten installieren (npm ci, nie npm install)
        working-directory: e2e
        run: npm ci
      - name: Lieferkette - Registry-Signaturen pruefen
        working-directory: e2e
        run: npm audit signatures
      - name: Type check (tsc)
        working-directory: e2e
        # Ohne diesen Schritt wuerde die Typpruefung dieses Pakets NIE laufen: die Werkzeuge und
        # Specs laufen per Node-Type-Stripping, das Typen entfernt statt sie zu pruefen. Ein
        # Typfehler faellt dann bestenfalls zur Laufzeit auf, schlimmstenfalls gar nicht.
        # Bewusst vor den teuren Schritten (Browser, Images, Stack) - er kostet Sekunden.
        run: npm run typecheck
      - name: Chromium installieren
        working-directory: e2e
        # --with-deps ausschliesslich hier im CI-Job: es installiert als root per apt-get eine aus
        # dem npm-Paket stammende Paketliste. Fuer Daniels Rechner ist das ausdruecklich nicht
        # vorgesehen (docs/setup.md, .claude/skills/browse-app/SKILL.md).
        run: npx playwright install --with-deps chromium

      - name: Pruefstack starten
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
          echo "Warte auf das Backend..."
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          echo "Warte auf das Frontend..."
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/

      - name: Demo-Datenbestand seeden
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml exec -T \
            -e PHOTOSORT_DEMO_STATE_CONFIRM=yes-wipe-and-seed-demo-data \
            backend python -m photosort.demo_state

      - name: Pruefungen im Browser
        working-directory: e2e
        run: npm test

      - name: Diagnose bei Fehlschlag - Container-Logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail 200

      # Nur bei Fehlschlag, feste Aufbewahrungsfrist, und ausschliesslich e2e/artifacts: der
      # gespeicherte Anmeldezustand liegt bewusst in e2e/.auth und kann hier strukturell nicht
      # mit hochgeladen werden (er enthaelt ein 30 Tage gueltiges, nicht widerrufbares JWT). Ein
      # roter Lauf ohne Bild waere fuer einen Entwickler ohne Augen genauso blind wie der Zustand
      # vor dieser Ebene - die Artefakte sind Teil der Zusage, nicht Komfort.
      - name: Artefakte hochladen (nur bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Aufraeumen
        if: always()
        run: |
          rm -rf e2e/.auth
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans || true
