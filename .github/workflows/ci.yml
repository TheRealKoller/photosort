name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Test (pytest, coverage gate 80%)
        run: pytest --cov=photosort --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  demo-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Validate docker-compose.yml + docker-compose.demo.yml overlay
        run: |
          cp .env.demo.example .env
          docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile seed config -q
      - name: Build seed image (Dockerfile smoke test, no real OpenCloud container)
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile seed build seed
      - name: Functional check - explicit IPv4-only default network (spec 0010)
        run: |
          set -euo pipefail
          # Isoliert vom vorherigen Overlay-Schritt: das dort kopierte Demo-.env soll
          # diesen Check nicht implizit beeinflussen (Compose liest .env automatisch
          # aus dem CWD, unabhängig von -f).
          rm -f .env
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose up -d postgres redis
          network_count=$(docker compose config --format json | jq '.networks | length')
          test "$network_count" = "1"
          network=$(docker compose config --format json | jq -r '.networks | to_entries[0].value.name')
          echo "Inspecting network: $network"
          enable_ipv6=$(docker network inspect "$network" --format '{{.EnableIPv6}}')
          driver=$(docker network inspect "$network" --format '{{.Driver}}')
          echo "EnableIPv6=$enable_ipv6 Driver=$driver"
          test "$enable_ipv6" = "false"
          test "$driver" = "bridge"
          docker compose down
          if docker network ls --format '{{.Name}}' | grep -qx "$network"; then
            echo "Network $network still exists after 'docker compose down'" >&2
            exit 1
          fi
      - name: Static check - worker command runs no migration (spec 0013)
        run: |
          set -euo pipefail
          worker_command=$(docker compose config --format json | jq -r '.services.worker.command | join(" ")')
          echo "worker command: $worker_command"
          if echo "$worker_command" | grep -qi "alembic"; then
            echo "worker command still runs alembic - migrations must run only in backend" >&2
            exit 1
          fi
          backend_command=$(docker compose config --format json | jq -r '.services.backend.command | join(" ")')
          echo "backend command: $backend_command"
          echo "$backend_command" | grep -q "alembic upgrade head"
          echo "$backend_command" | grep -q "uvicorn"
      - name: Functional check - single-service migration ownership against a fresh DB (spec 0013)
        run: |
          set -euo pipefail
          # Isoliert vom vorherigen Schritt, siehe Kommentar oben zum IPv4-Check.
          rm -f .env
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT

          export AUTH_SEED_USER1_USERNAME=ci-user1
          export AUTH_SEED_USER1_PASSWORD="ci-password-1-$RANDOM"
          export AUTH_SEED_USER2_USERNAME=ci-user2
          export AUTH_SEED_USER2_PASSWORD="ci-password-2-$RANDOM"
          export SECRET_KEY="ci-only-secret-key-not-for-production-0013-$RANDOM"

          docker compose up -d --build backend worker

          # "docker compose up" blockiert wegen worker's "depends_on: backend: condition:
          # service_healthy" bereits selbst, bis backend healthy ist - diese Wartschleife ist
          # eine bewusste zweite Verteidigungslinie (u.a. gegen Compose-Versionsunterschiede
          # zwischen lokal und CI-Runner) und liefert im Fehlerfall eine klare Fehlermeldung
          # statt eines reinen "dependency failed to start"-Abbruchs von "up" selbst.
          echo "Waiting for backend to become healthy..."
          backend_cid=$(docker compose ps -q backend)
          healthy=0
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$backend_cid")
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "backend did not become healthy in time" >&2
            docker compose logs
            exit 1
          fi

          backend_log=$(docker compose logs backend)
          worker_log=$(docker compose logs worker)

          echo "--- backend ran the migration exactly once (revision 1574f8180817) ---"
          # alembic loggt jede Revision zweimal in der Kette (einmal als Ziel des eigenen
          # Upgrade-Schritts, einmal als Quelle des nächsten) - "-> 1574f8180817," matcht
          # gezielt nur den eigenen Upgrade-Schritt, nicht den Folgeschritt.
          revision_hits=$(echo "$backend_log" | grep -c -- "-> 1574f8180817," || true)
          test "$revision_hits" = "1"

          echo "--- worker never invoked alembic ---"
          if echo "$worker_log" | grep -qi "alembic"; then
            echo "worker log unexpectedly mentions alembic" >&2
            exit 1
          fi

          echo "--- known race error does not appear in either log ---"
          if printf '%s\n%s\n' "$backend_log" "$worker_log" | grep -q 'duplicate key value violates unique constraint "pg_type_typname_nsp_index"'; then
            echo "race condition error present in logs" >&2
            exit 1
          fi

          echo "--- alembic_version has exactly one row matching the current head ---"
          expected_head=$(docker compose exec -T backend alembic heads | awk '{print $1}')
          actual_rows=$(docker compose exec -T postgres psql -U "${POSTGRES_USER:-photosort}" -d "${POSTGRES_DB:-photosort}" -tAc "SELECT version_num FROM alembic_version;")
          row_count=$(printf '%s' "$actual_rows" | grep -c . || true)
          test "$row_count" = "1"
          test "$(printf '%s' "$actual_rows" | tr -d '[:space:]')" = "$expected_head"

          echo "--- RestartCount is 0 for both containers ---"
          backend_restarts=$(docker inspect --format '{{.RestartCount}}' "$backend_cid")
          worker_restarts=$(docker inspect --format '{{.RestartCount}}' "$(docker compose ps -q worker)")
          test "$backend_restarts" = "0"
          test "$worker_restarts" = "0"

          echo "--- login with the seeded user succeeds ---"
          login_response_file=$(mktemp)
          login_status=$(curl -s -o "$login_response_file" -w '%{http_code}' -X POST "http://localhost:${BACKEND_PORT:-8000}/auth/login" -H 'Content-Type: application/json' -d "{\"username\": \"$AUTH_SEED_USER1_USERNAME\", \"password\": \"$AUTH_SEED_USER1_PASSWORD\"}")
          test "$login_status" = "200"
          grep -q "access_token" "$login_response_file"
          rm -f "$login_response_file"
          # Kein explizites "docker compose down" hier nötig - der "trap ... EXIT" oben
          # räumt den Stack inkl. Volume bereits auf.
      - name: Functional check - SPA fallback in frontend nginx (spec 0016)
        run: |
          set -euo pipefail
          # Isoliert vom vorherigen Schritt, siehe Kommentar oben zum IPv4-Check.
          rm -f .env
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT

          # Bewusst "--no-deps": der SPA-Fallback ist rein nginx-seitig und haengt nicht
          # von backend/postgres/redis ab (siehe Teststrategie, Spec 0016).
          docker compose up -d --no-deps --build frontend

          echo "Waiting for frontend to respond..."
          base_url="http://localhost:${FRONTEND_PORT:-8080}"
          ready=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "$base_url/"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "frontend did not respond in time" >&2
            docker compose logs frontend
            exit 1
          fi

          # Holt Status+Body in einem einzigen curl-Aufruf statt getrennter Requests fuer
          # Status und Body (weniger redundante Requests, ein Trennzeichen am Ende reicht).
          # Ergebnis in FETCH_STATUS/FETCH_BODY, plus Echo des Status vor jeder Assertion
          # fuer bessere Diagnose bei einem CI-Fehlschlag (analog zum IPv4-Check oben).
          fetch() {
            local url="$1" response
            response=$(curl -s -w '\n%{http_code}' "$url")
            FETCH_STATUS="${response##*$'\n'}"
            FETCH_BODY="${response%$'\n'*}"
          }

          echo "--- GET / returns 200 with index.html content ---"
          fetch "$base_url/"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "200"
          index_body="$FETCH_BODY"

          echo "--- GET /projects/3 (erfundene Client-Route) faellt auf index.html-Body zurueck, 200 ---"
          fetch "$base_url/projects/3"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "200"
          test "$FETCH_BODY" = "$index_body"

          echo "--- GET /this/path/does/not/exist (generischer Pfad) faellt auf index.html-Body zurueck, 200 ---"
          fetch "$base_url/this/path/does/not/exist"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "200"
          test "$FETCH_BODY" = "$index_body"

          echo "--- echtes statisches Asset wird direkt ausgeliefert (200, korrekter Content-Type, kein index.html-Body) ---"
          asset_path=$(docker compose exec -T frontend sh -c "find /usr/share/nginx/html/assets -maxdepth 1 -type f -name '*.js' | head -n1" | tr -d '\r\n')
          if [ -z "$asset_path" ]; then
            echo "kein gebautes JS-Asset im Image gefunden" >&2
            exit 1
          fi
          asset_url_path="/assets/$(basename "$asset_path")"
          fetch "$base_url$asset_url_path"
          asset_content_type=$(curl -s -o /dev/null -w '%{content_type}' "$base_url$asset_url_path")
          echo "status: $FETCH_STATUS, content-type: $asset_content_type"
          test "$FETCH_STATUS" = "200"
          echo "$asset_content_type" | grep -qi "javascript"
          test "$FETCH_BODY" != "$index_body"

          echo "--- nicht existentes, asset-artiges Pfad bleibt 404 (try_files nicht zu breit gefasst) ---"
          fetch "$base_url/assets/definitiv-nicht-vorhanden.js"
          echo "status: $FETCH_STATUS"
          test "$FETCH_STATUS" = "404"
