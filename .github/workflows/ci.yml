name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Test (pytest, coverage gate 80%)
        run: pytest --cov=photosort --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  demo-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Validate docker-compose.yml + docker-compose.demo.yml overlay
        run: |
          cp .env.demo.example .env
          docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile seed config -q
      - name: Build seed image (Dockerfile smoke test, no real OpenCloud container)
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml --profile seed build seed
      - name: Functional check - explicit IPv4-only default network (spec 0010)
        run: |
          set -euo pipefail
          # Isoliert vom vorherigen Overlay-Schritt: das dort kopierte Demo-.env soll
          # diesen Check nicht implizit beeinflussen (Compose liest .env automatisch
          # aus dem CWD, unabhängig von -f).
          rm -f .env
          trap 'docker compose down -v --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose up -d postgres redis
          network_count=$(docker compose config --format json | jq '.networks | length')
          test "$network_count" = "1"
          network=$(docker compose config --format json | jq -r '.networks | to_entries[0].value.name')
          echo "Inspecting network: $network"
          enable_ipv6=$(docker network inspect "$network" --format '{{.EnableIPv6}}')
          driver=$(docker network inspect "$network" --format '{{.Driver}}')
          echo "EnableIPv6=$enable_ipv6 Driver=$driver"
          test "$enable_ipv6" = "false"
          test "$driver" = "bridge"
          docker compose down
          if docker network ls --format '{{.Name}}' | grep -qx "$network"; then
            echo "Network $network still exists after 'docker compose down'" >&2
            exit 1
          fi
