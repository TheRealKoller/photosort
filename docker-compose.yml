services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photosort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photosort}
      POSTGRES_DB: ${POSTGRES_DB:-photosort}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photosort}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photosort}:${POSTGRES_PASSWORD:-photosort}@postgres:5432/${POSTGRES_DB:-photosort}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANDMARK_PROVIDER: ${LANDMARK_PROVIDER:-anthropic}
      LANDMARK_MODEL: ${LANDMARK_MODEL:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENCLOUD_BASE_URL: ${OPENCLOUD_BASE_URL:-}
      OPENCLOUD_USERNAME: ${OPENCLOUD_USERNAME:-}
      OPENCLOUD_APP_TOKEN: ${OPENCLOUD_APP_TOKEN:-}
      OPENCLOUD_DRIVE_NAME: ${OPENCLOUD_DRIVE_NAME:-}
      AUTH_SEED_USER1_USERNAME: ${AUTH_SEED_USER1_USERNAME:-change-me}
      AUTH_SEED_USER1_PASSWORD: ${AUTH_SEED_USER1_PASSWORD:-change-me}
      AUTH_SEED_USER2_USERNAME: ${AUTH_SEED_USER2_USERNAME:-change-me}
      AUTH_SEED_USER2_PASSWORD: ${AUTH_SEED_USER2_PASSWORD:-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      # Feature-Flag fuer die lokale Top-Foto-Auswahl mit Kategorie-Mix
      # (specs/features/0024-top-photo-selection-category-mix.md). Nur hier im API-Service noetig
      # (der 403-Gate-Check sitzt in api/projects.py), der Worker-Job selbst prueft dieses Flag
      # nicht - seine einzige Vorbedingung ist ein erfolgreicher ScoringRun.
      CATEGORY_SELECTION_ENABLED: ${CATEGORY_SELECTION_ENABLED:-true}
      # Eye als dritte Laufwahl (specs/features/0609-eye-dritte-wahl.md). Der Schalter ist die
      # EINE Quelle der Laufwahl in der Oberflaeche; die Adresse zeigt auf den Sidecar im
      # Compose-Netz. Beide muessen zusammenpassen - "true" ohne gesunden Dienst endet im
      # sichtbaren 503, nie in einem stillen Rueckfall.
      EYE_ENABLED: ${EYE_ENABLED:-false}
      EYE_SERVICE_URL: ${EYE_SERVICE_URL:-http://eye:8090}
    command: ["sh", "-c", "alembic upgrade head && uvicorn photosort.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Bewusst kein "ports:": Die API ist ausschliesslich ueber den nginx des frontend-Services
    # unter /api erreichbar. Wer den Port lokal braucht (npm run dev), setzt ihn in einer eigenen,
    # nicht eingecheckten docker-compose.override.yml (docs/setup.md).
    volumes:
      - photo_cache:/data/photo-cache
      # Der vorbereitete GeoNames-Auszug (ADR 0105 Punkt 3). Hier SCHREIBBAR, weil das getippte
      # Bezugskommando ueber die Konsole dieses Dienstes laeuft:
      #   docker compose exec backend python -m photosort.place_dataset
      # Genau ein Schreiber - im Worker unten steht dasselbe Volume nur lesend.
      - place_dataset:/data/place-dataset

  # Verarbeitet Hintergrund-Jobs (Foto-Ingest, Thumbnails, KI-Scoring) via arq.
  # Führt selbst keine Migration mehr aus (siehe specs/decisions/0012-single-service-migration-ownership.md)
  # - wartet stattdessen per depends_on auf einen bereits vollständig migrierten backend-Service,
  # um die Race gegen eine frische DB strukturell auszuschließen (beide Services führten zuvor
  # unabhängig "alembic upgrade head" aus).
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-photosort}:${POSTGRES_PASSWORD:-photosort}@postgres:5432/${POSTGRES_DB:-photosort}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANDMARK_PROVIDER: ${LANDMARK_PROVIDER:-anthropic}
      LANDMARK_MODEL: ${LANDMARK_MODEL:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENCLOUD_BASE_URL: ${OPENCLOUD_BASE_URL:-}
      OPENCLOUD_USERNAME: ${OPENCLOUD_USERNAME:-}
      OPENCLOUD_APP_TOKEN: ${OPENCLOUD_APP_TOKEN:-}
      OPENCLOUD_DRIVE_NAME: ${OPENCLOUD_DRIVE_NAME:-}
      AUTH_SEED_USER1_USERNAME: ${AUTH_SEED_USER1_USERNAME:-change-me}
      AUTH_SEED_USER1_PASSWORD: ${AUTH_SEED_USER1_PASSWORD:-change-me}
      AUTH_SEED_USER2_USERNAME: ${AUTH_SEED_USER2_USERNAME:-change-me}
      AUTH_SEED_USER2_PASSWORD: ${AUTH_SEED_USER2_PASSWORD:-change-me}
      EYE_ENABLED: ${EYE_ENABLED:-false}
      EYE_SERVICE_URL: ${EYE_SERVICE_URL:-http://eye:8090}
    command: ["python", "-m", "arq", "photosort.worker.WorkerSettings"]
    volumes:
      - photo_cache:/data/photo-cache
      # NUR LESEND (`:ro`): Der operative Pfad ist kein Schreiber. Fehlt der Auszug oder weicht er
      # von seinem Hash ab, wird kein Aufloeser gebaut, es entsteht kein Ersatzweg, und die Events
      # behalten Nummer und Zeitspanne - der Lauf laeuft durch.
      - place_dataset:/data/place-dataset:ro

  # Eye-Sidecar (specs/features/0609-eye-dritte-wahl.md, ADR 0138 Punkt 2). Bewusst hinter dem
  # Profil "eye": ein Standard-"up" startet ihn nicht, und die Laufwahl bleibt ueber EYE_ENABLED
  # aus. Kein "ports:" (nur im Compose-Netz erreichbar), keine Datenbank-, Cache- oder
  # Geheimnisvariable (S1). Die Gewichte kommen aus dem Volume "eye_model", das der Einmal-Dienst
  # "eye-model" unter "--profile eye-setup" fuellt - sie liegen nie im Image und nie im Repository.
  eye:
    build: ./eye
    profiles: ["eye"]
    restart: unless-stopped
    # Nicht als root: der Dienst schreibt nur in sein eigenes Home (Install-ID der Lizenz).
    user: node
    environment:
      DAL_APP_ID: photosort
      EYE_MODEL_DIR: /model
    volumes:
      - eye_model:/model:ro
      - eye_home:/home/node
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Einmal-Dienst: holt die Gewichte des gepinnten Commits und prueft jede Datei gegen ihren
  # SHA-256, BEVOR sie an ihren Platz wandert. Laeuft als root, weil ein frisches Named Volume
  # root gehoert; der Dienst selbst liest das Volume spaeter nur.
  eye-model:
    build: ./eye
    profiles: ["eye-setup"]
    user: "0:0"
    command: ["node", "src/fetch-model.js"]
    environment:
      EYE_MODEL_DIR: /model
    volumes:
      - eye_model:/model

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  photo_cache:
  place_dataset:
  # Nur die Gewichte (ro gelesen) und das Home des Sidecars (Install-ID der Lizenz, rw).
  eye_model:
  eye_home:

# Expliziter Default-Netzwerk-Block statt des von Docker Compose automatisch angelegten
# Default-Netzwerks (siehe specs/features/0010-explicit-ipv4-only-network.md): das externe
# Deploy-Tool "Dockhand" hat Probleme, automatisch angelegte IPv6-fähige Netzwerke sauber
# zu löschen. Der Schlüssel heißt bewusst weiterhin "default" (kein neuer Name) - dadurch
# hängen sich alle Services oben automatisch weiter an dieses Netzwerk, ohne dass eine der
# Service-Definitionen ein eigenes "networks:" braucht. Kein driver_opts/Subnetz nötig,
# Docker vergibt weiterhin automatisch ein IPv4-Subnetz.
networks:
  default:
    driver: bridge
    enable_ipv6: false
